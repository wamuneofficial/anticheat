<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anti-Cheat CF</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --text: #1b1f24;
    --muted: #5b6572;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --border: #e2e5ea;
    --ok: #1a8a4a;
    --warn: #b45309;
    --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card-bg: #1e2126;
      --text: #eef0f2;
      --muted: #9aa4b2;
      --accent: #4f8cff;
      --accent-text: #0b0e12;
      --border: #2b2f36;
      --ok: #3ecb7e;
      --warn: #e5a44d;
      --err: #f2685f;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px 24px;
    text-align: center;
  }
  .badge {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-bottom: 14px;
  }
  .badge.loading { background: var(--muted); animation: pulse 1.2s ease-in-out infinite; }
  .badge.online { background: var(--ok); }
  .badge.warn { background: var(--warn); }
  .badge.offline { background: var(--err); }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }
  h1 {
    font-size: 22px;
    margin: 0 0 10px;
    line-height: 1.3;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: var(--muted);
    margin: 0 0 8px;
  }
  .meta {
    font-size: 13px;
    color: var(--muted);
    margin-top: 14px;
  }
  .actions {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
  }
  button {
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    padding: 10px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-text);
    cursor: pointer;
  }
  button:active { opacity: 0.85; }
  a.manual-link {
    color: var(--accent);
    font-size: 14px;
    word-break: break-all;
  }
  .countdown {
    font-size: 13px;
    color: var(--muted);
  }
  .title-row {
    font-size: 13px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 4px;
  }
</style>
</head>
<body>
  <main class="card" id="card" aria-live="polite">
    <div class="title-row">Anti-Cheat CF</div>
    <div class="badge loading" id="badge"></div>
    <h1 id="heading">Проверяем сервер...</h1>
    <p id="text">Проверяем, включён ли сервер...</p>
    <div class="meta" id="meta"></div>
    <div class="actions" id="actions"></div>
  </main>

<script>
(function () {
  "use strict";

  var STATUS_API_URL = "https://api.github.com/repos/wamuneofficial/anticheat/contents/status.json";
  var RECHECK_SECONDS = 20;
  var ALIVE_TIMEOUT_MS = 6000;

  var badgeEl = document.getElementById("badge");
  var headingEl = document.getElementById("heading");
  var textEl = document.getElementById("text");
  var metaEl = document.getElementById("meta");
  var actionsEl = document.getElementById("actions");

  var countdownTimer = null;
  var countdownValue = 0;

  function clearCountdown() {
    if (countdownTimer) {
      clearInterval(countdownTimer);
      countdownTimer = null;
    }
  }

  function startCountdown() {
    clearCountdown();
    countdownValue = RECHECK_SECONDS;
    renderCountdown();
    countdownTimer = setInterval(function () {
      countdownValue -= 1;
      if (countdownValue <= 0) {
        clearCountdown();
        runCheck();
        return;
      }
      renderCountdown();
    }, 1000);
  }

  function renderCountdown() {
    var el = document.getElementById("countdown-text");
    if (el) {
      el.textContent = "Следующая проверка через " + countdownValue + " с";
    }
  }

  function setState(kind, heading, text, metaHtml, actionsHtml) {
    badgeEl.className = "badge " + kind;
    headingEl.textContent = heading;
    textEl.textContent = text;
    metaEl.innerHTML = metaHtml || "";
    actionsEl.innerHTML = actionsHtml || "";
  }

  function formatLocal(iso) {
    if (!iso) return null;
    var d = new Date(iso);
    if (isNaN(d.getTime())) return null;
    try {
      return d.toLocaleString("ru-RU");
    } catch (e) {
      return d.toString();
    }
  }

  function showLoading() {
    clearCountdown();
    setState("loading", "Проверяем сервер...", "Проверяем, включён ли сервер...", "", "");
  }

  function showOnline(url) {
    clearCountdown();
    var actions =
      '<a class="manual-link" href="' + escapeHtml(url) + '">' + escapeHtml(url) + "</a>";
    setState(
      "online",
      "Сервер включён, открываем...",
      "Если переход не начался автоматически, воспользуйтесь ссылкой ниже.",
      "",
      actions
    );
    try {
      window.location.replace(url);
    } catch (e) {
      // игнорируем — ссылка ниже всё равно есть
    }
  }

  function showDashboardDown(lastKnown) {
    var meta = lastKnown ? "Последний раз был в сети: " + escapeHtml(lastKnown) : "";
    var actions =
      '<button id="retry-btn" type="button">Проверить снова</button>' +
      '<div class="countdown" id="countdown-text"></div>';
    setState(
      "warn",
      "Ноутбук в сети, но дашборд не запущен",
      "Тоннель отвечает, но сам дашборд на ноутбуке сейчас не работает.",
      meta,
      actions
    );
    bindRetry();
    startCountdown();
  }

  function showOffline(lastKnown) {
    var meta = lastKnown ? "Последний раз был в сети: " + escapeHtml(lastKnown) : "";
    var actions =
      '<button id="retry-btn" type="button">Проверить снова</button>' +
      '<div class="countdown" id="countdown-text"></div>';
    setState(
      "offline",
      "Сервер выключен",
      "Дашборд работает на ноутбуке владельца, и сейчас он выключен или не в сети.",
      meta,
      actions
    );
    bindRetry();
    startCountdown();
  }

  function bindRetry() {
    var btn = document.getElementById("retry-btn");
    if (btn) {
      btn.addEventListener("click", function () {
        runCheck();
      });
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fetchStatusPrimary() {
    return fetch(STATUS_API_URL, {
      headers: { Accept: "application/vnd.github.raw+json" },
      cache: "no-store",
    }).then(function (resp) {
      if (!resp.ok) throw new Error("primary status fetch failed: " + resp.status);
      return resp.json();
    });
  }

  function fetchStatusFallback() {
    return fetch("./status.json?t=" + Date.now(), { cache: "no-store" }).then(function (resp) {
      if (!resp.ok) throw new Error("fallback status fetch failed: " + resp.status);
      return resp.json();
    });
  }

  function getStatus() {
    return fetchStatusPrimary().catch(function () {
      return fetchStatusFallback();
    });
  }

  function checkAlive(url) {
    var controller = null;
    var timeoutId = null;
    var signal;
    try {
      controller = new AbortController();
      signal = controller.signal;
      timeoutId = setTimeout(function () {
        controller.abort();
      }, ALIVE_TIMEOUT_MS);
    } catch (e) {
      signal = undefined;
    }
    return fetch(url.replace(/\/+$/, "") + "/__alive?deep=1", {
      cache: "no-store",
      mode: "cors",
      signal: signal,
    })
      .then(function (resp) {
        if (timeoutId) clearTimeout(timeoutId);
        return resp;
      })
      .catch(function (err) {
        if (timeoutId) clearTimeout(timeoutId);
        throw err;
      });
  }

  function runCheck() {
    showLoading();
    getStatus()
      .then(function (status) {
        var lastKnown = formatLocal((status && (status.last_online || status.updated)) || null);
        if (!status || !status.url) {
          showOffline(lastKnown);
          return;
        }
        var url = status.url;
        checkAlive(url)
          .then(function (resp) {
            if (resp.status === 200) {
              showOnline(url);
            } else if (resp.status === 503) {
              showDashboardDown(lastKnown);
            } else {
              showOffline(lastKnown);
            }
          })
          .catch(function () {
            showOffline(lastKnown);
          });
      })
      .catch(function () {
        showOffline(null);
      });
  }

  runCheck();
})();
</script>
</body>
</html>
